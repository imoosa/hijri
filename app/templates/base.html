<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bohra Hijri Calendar{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Liturgical Theme Engine -- today's Christian liturgical season sets
           this accent, used as a thin app-wide highlight (topbar underline +
           a small badge) rather than overriding the app's core Bohra maroon
           branding wholesale. */
        :root{ --liturgical-accent: {{ liturgical_color_hex }}; }
        .topbar{ border-bottom: 3px solid var(--liturgical-accent); }
        .liturgical-badge{
            display:inline-flex; align-items:center; gap:5px; font-size:11px;
            color:#666; margin-left:10px; padding:2px 8px; border-radius:10px;
            background:color-mix(in srgb, var(--liturgical-accent) 12%, transparent);
        }
        .liturgical-badge .dot{
            width:8px; height:8px; border-radius:50%; background:var(--liturgical-accent);
            display:inline-block;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">Bohra Calendar</div>
        <span class="liturgical-badge" title="Christian liturgical season, sets today's accent color"><span class="dot"></span>{{ liturgical_season_name }}</span>
        <input type="checkbox" id="menu-toggle" class="menu-toggle-checkbox">
        <label for="menu-toggle" class="menu-toggle-label" aria-label="Menu">
            <span></span><span></span><span></span>
        </label>
        <nav class="menu">
            <a href="{{ url_for('calendar_view') }}" class="{{ 'active' if active == 'calendar' else '' }}">Calendar</a>
            <a href="{{ url_for('prayer_view') }}" class="{{ 'active' if active == 'prayer' else '' }}">Prayer Times</a>
            <a href="{{ url_for('qibla_view') }}" class="{{ 'active' if active == 'qibla' else '' }}">Qibla</a>
            <a href="{{ url_for('events_view') }}" class="{{ 'active' if active == 'events' else '' }}">Events</a>
            <a href="{{ url_for('settings_view') }}" class="{{ 'active' if active == 'settings' else '' }}">Settings</a>
        </nav>
        <div class="alerts-widget">
            <label title="Chime + on-screen notification for azaan times, birthdays/anniversaries, and today's tradition holidays. Only fires while this tab stays open -- switching pages resets the timers, closing the tab stops it entirely. Not the actual azaan recitation.">
                <input type="checkbox" id="alerts-enabled">
                Sound reminders
            </label>
        </div>
    </header>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
        <div class="flash">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <style>
        /* [guessing] Sidebar column removed entirely -- the "sidebar" block
           this base template used to expose is never overridden in any
           page template I have, so that column only ever held the note +
           alerts widgets. .app-body forced to block layout here as a
           safety-net override, in case style.css had it set to
           display:flex for the old two-column shell -- I don't have that
           file so I can't confirm, only guard against it. */
        .app-body{ display:block; }
        .main-content{ width:100%; }

        /* Note card: floating + draggable on every screen size now, not
           just mobile. Defaults to the bottom-right corner until dragged,
           same spot the old mobile-only version used -- just no longer
           gated behind a media query. */
        .notes-widget{
            position:fixed; z-index:60; width:230px; padding:0;
        }
        .notes-widget .notes-header{ cursor:grab; touch-action:none; }
        .notes-widget .notes-header:active{ cursor:grabbing; }
        .note-reopen-btn.floating-reopen{
            position:fixed; z-index:60; right:16px; bottom:16px;
        }

        /* Card shell -- this is what carries the shadow/radius now, not
           .sticky-note itself, so the header and toolbar sit inside the
           same rounded card instead of floating above/below it. */
        .sticky-note-card{
            background:#fff8d6;border-radius:8px;
            box-shadow:0 4px 14px rgba(0,0,0,.16);
            overflow:hidden;display:flex;flex-direction:column;
        }
        .notes-header{
            display:flex;align-items:center;justify-content:space-between;
            padding:6px 8px;
        }
        .notes-drag-dots{color:#00000045;font-size:13px;letter-spacing:2px;user-select:none;}
        .notes-header-actions{display:flex;gap:2px;}
        .notes-icon-btn{
            border:none;background:none;cursor:pointer;color:#4a4326;
            width:24px;height:24px;border-radius:4px;font-size:13px;
            display:inline-flex;align-items:center;justify-content:center;padding:0;
        }
        .notes-icon-btn:hover{background:#00000012;}
        /* Only "..." is still disabled -- there's genuinely nothing to put
           in that menu yet. "+" now does something real (see JS). */
        .notes-icon-btn:disabled{opacity:.4;cursor:default;}
        .notes-icon-btn:disabled:hover{background:none;}

        .notes-toolbar{display:flex;align-items:center;gap:2px;
            padding:6px 8px;border-top:1px solid rgba(0,0,0,.08);}
        .notes-toolbar button#note-bold-btn{font-weight:700;}
        .notes-toolbar button#note-italic-btn{font-style:italic;}
        .notes-toolbar button#note-underline-btn{text-decoration:underline;}
        .note-save-status{margin-left:auto;font-size:11px;color:#8a8360;}

        .sticky-note{min-height:150px;background:transparent;
            box-shadow:none;padding:4px 14px 10px;font-size:13.5px;
            line-height:1.55;outline:none;white-space:pre-wrap;}
        .sticky-note:empty::before{content:attr(data-placeholder);color:#a89a5c;}
        .sticky-note ul,.sticky-note ol{margin:4px 0 4px 18px;padding:0;}

        /* Collapsed -- hides body + toolbar, leaves the header bar as a
           thin strip. Works at any screen width, per your ask for mobile
           specifically, but there's no reason to lock it to mobile only. */
        .sticky-note-card.collapsed .sticky-note,
        .sticky-note-card.collapsed .notes-toolbar{
            display:none;
        }

        /* Reopen pill shown only when the card has been closed via the X --
           without this, closing the note would be a one-way trip with no
           way back short of clearing localStorage. */
        .note-reopen-btn{margin:14px 16px 0;border:1px dashed #ccc;background:#fff;
            border-radius:6px;padding:6px 10px;font-size:12px;color:#777;cursor:pointer;
            display:none;}
        .note-reopen-btn:hover{background:#f4f1ea;}

        /* Sound reminders now lives as a compact inline toggle in the topbar
           (see header markup) instead of a sidebar block, so it's just a
           label + checkbox with no card chrome needed. */
        .alerts-widget{display:flex;align-items:center;gap:6px;font-size:12px;color:#666;margin-left:auto;}
        .alerts-widget label{display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;}
    </style>

    <div class="app-body">
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Sticky note: floats globally over every page now (no sidebar column
         to sit in), draggable by its header on desktop and mobile alike.
         Any page can open it with window.openStickyNote() -- calendar.html
         uses this to put its own "+ Note" trigger in its toolbar instead of
         relying on the fallback reopen pill below. -->
    <div class="notes-widget">
        <div class="sticky-note-card">
            <div class="notes-header">
                <span class="notes-drag-dots" title="Drag from here to move the note">::::</span>
                <div class="notes-header-actions">
                    <button type="button" id="note-collapse-btn" class="notes-icon-btn" title="Collapse/expand">&minus;</button>
                    <button type="button" id="note-new-btn" class="notes-icon-btn" title="Clear this note and start fresh">+</button>
                    <button type="button" class="notes-icon-btn" title="Nothing to put in this menu yet" disabled>&#8942;</button>
                    <button type="button" id="note-close-btn" class="notes-icon-btn" title="Hide">&times;</button>
                </div>
            </div>

            <div id="sticky-note" class="sticky-note" contenteditable="true"
                 data-placeholder="Write something important&hellip;">{{ sidebar_note_content|safe }}</div>

            <div class="notes-toolbar">
                <button type="button" id="note-bold-btn" class="notes-icon-btn" title="Bold the selected text">B</button>
                <button type="button" id="note-italic-btn" class="notes-icon-btn" title="Italic the selected text">I</button>
                <button type="button" id="note-underline-btn" class="notes-icon-btn" title="Underline the selected text">U</button>
                <button type="button" id="note-bullet-btn" class="notes-icon-btn" title="Bullet list">&#9776;</button>
                <button type="button" id="note-number-btn" class="notes-icon-btn" title="Numbered list">1.</button>
                <button type="button" id="note-image-btn" class="notes-icon-btn"
                        title="Not wired to a backend yet -- see the sanitizer note below">&#128247;</button>
                <span id="note-save-status" class="note-save-status"></span>
            </div>
        </div>
    </div>
    <!-- Fallback trigger for pages that don't add their own "+ Note" button
         (e.g. calendar.html puts one in its toolbar instead -- see there). -->
    <button type="button" id="note-reopen-btn" class="note-reopen-btn floating-reopen">+ Note</button>

    <script>
    (function(){
        var note = document.getElementById('sticky-note');
        var status = document.getElementById('note-save-status');
        var saveTimer = null;

        function saveNote(){
            status.textContent = 'Saving…';
            fetch('{{ url_for("save_note") }}', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'content=' + encodeURIComponent(note.innerHTML)
            }).then(function(r){
                status.textContent = r.ok ? 'Saved' : 'Could not save';
                setTimeout(function(){ status.textContent = ''; }, 1500);
            }).catch(function(){
                status.textContent = 'Could not save';
            });
        }

        note.addEventListener('input', function(){
            clearTimeout(saveTimer);
            status.textContent = '';
            saveTimer = setTimeout(saveNote, 800);
        });
        note.addEventListener('blur', saveNote);

        // execCommand is deprecated but still the simplest way to get basic
        // rich-text toggling in a contenteditable box without pulling in a
        // whole editor library -- fine for five buttons.
        function bindCmd(id, cmd){
            document.getElementById(id).addEventListener('click', function(){
                document.execCommand(cmd);
                note.focus();
            });
        }
        bindCmd('note-bold-btn', 'bold');
        bindCmd('note-italic-btn', 'italic');
        bindCmd('note-underline-btn', 'underline');
        bindCmd('note-bullet-btn', 'insertUnorderedList');
        bindCmd('note-number-btn', 'insertOrderedList');

        // Close/reopen -- persisted so an accidental close doesn't feel
        // like the note vanished. Card and pill states are always kept
        // as exact opposites of each other.
        var widget = document.querySelector('.notes-widget');
        var card = document.querySelector('.sticky-note-card');
        var header = document.querySelector('.notes-header');
        var reopenBtn = document.getElementById('note-reopen-btn');
        var HIDE_KEY = 'sticky-note-hidden';
        function setHidden(hidden){
            card.style.display = hidden ? 'none' : '';
            reopenBtn.style.display = hidden ? 'inline-block' : 'none';
            localStorage.setItem(HIDE_KEY, hidden ? '1' : '0');
        }
        document.getElementById('note-close-btn').addEventListener('click', function(){ setHidden(true); });
        reopenBtn.addEventListener('click', function(){ setHidden(false); });
        setHidden(localStorage.getItem(HIDE_KEY) === '1');
        window.openStickyNote = function(){ setHidden(false); note.focus(); };

        // "+" -- there's only one note slot (see database.py's Note model),
        // so this can't create a second note. What it CAN honestly do is
        // clear the current one so you're starting fresh, same as opening
        // a blank Windows sticky note -- with a confirm so a stray tap
        // doesn't wipe something you meant to keep.
        document.getElementById('note-new-btn').addEventListener('click', function(){
            if (note.textContent.trim() === '' || confirm('Clear the current note and start a new one?')) {
                note.innerHTML = '';
                note.focus();
                saveNote();
            }
        });

        // Collapse -- shrinks the card to just its header bar. Works on
        // any screen size, not only mobile; nothing stops you from using
        // it on desktop too.
        var COLLAPSE_KEY = 'sticky-note-collapsed';
        var collapseBtn = document.getElementById('note-collapse-btn');
        function setCollapsed(collapsed){
            card.classList.toggle('collapsed', collapsed);
            collapseBtn.innerHTML = collapsed ? '&#9633;' : '&minus;';
            collapseBtn.title = collapsed ? 'Expand' : 'Collapse';
            localStorage.setItem(COLLAPSE_KEY, collapsed ? '1' : '0');
        }
        collapseBtn.addEventListener('click', function(){
            setCollapsed(!card.classList.contains('collapsed'));
        });
        setCollapsed(localStorage.getItem(COLLAPSE_KEY) === '1');

        // Deliberately NOT wired to insertImage/execCommand -- that would
        // embed a base64 data: URI, and _NOTE_ALLOWED_TAGS in main.py has
        // no img entry, so sanitize_note_html would strip it back out on
        // the very next save. Shipping a button that silently loses your
        // image is worse than no button, so this says so instead.
        document.getElementById('note-image-btn').addEventListener('click', function(){
            alert('Image notes need a small backend change first (main.py: add "img" to _NOTE_ALLOWED_TAGS, plus an upload endpoint). Not done yet -- ask if you want that built.');
        });

        // ---- Drag the whole card around on any screen size, position
        // persisted across page loads (and across pages, since this markup
        // is now global instead of living inside a per-page sidebar).
        var POS_KEY = 'sticky-note-pos';

        function applyPosition(){
            var saved = null;
            try { saved = JSON.parse(localStorage.getItem(POS_KEY) || 'null'); } catch(e){}
            if (saved && typeof saved.left === 'number' && typeof saved.top === 'number'){
                widget.style.left = saved.left + 'px';
                widget.style.top = saved.top + 'px';
                widget.style.right = widget.style.bottom = '';
            } else {
                widget.style.left = widget.style.top = '';
                widget.style.right = '16px';
                widget.style.bottom = '16px';
            }
        }
        applyPosition();

        var dragging = false, startX, startY, startLeft, startTop;
        header.addEventListener('pointerdown', function(e){
            if (e.target.closest('button')) return; // header buttons still need to be tappable, not drag starters
            dragging = true;
            header.setPointerCapture(e.pointerId);
            var rect = widget.getBoundingClientRect();
            startX = e.clientX; startY = e.clientY;
            startLeft = rect.left; startTop = rect.top;
            widget.style.right = widget.style.bottom = '';
        });
        header.addEventListener('pointermove', function(e){
            if (!dragging) return;
            var left = startLeft + (e.clientX - startX);
            var top = startTop + (e.clientY - startY);
            left = Math.max(0, Math.min(window.innerWidth - widget.offsetWidth, left));
            top = Math.max(0, Math.min(window.innerHeight - widget.offsetHeight, top));
            widget.style.left = left + 'px';
            widget.style.top = top + 'px';
        });
        function endDrag(){
            if (!dragging) return;
            dragging = false;
            localStorage.setItem(POS_KEY, JSON.stringify({
                left: parseInt(widget.style.left, 10),
                top: parseInt(widget.style.top, 10)
            }));
        }
        header.addEventListener('pointerup', endDrag);
        header.addEventListener('pointercancel', endDrag);
    })();
    </script>

    <script>
    // ---- sound reminders: azaan times, personal events, tradition holidays ----
    // Lives only as long as this tab does -- see the caveat text in the
    // sidebar. No server push involved.
    (function(){
        var toggle = document.getElementById('alerts-enabled');
        var STORAGE_KEY = 'alerts-enabled';
        var playedKey = 'alerts-played-' + new Date().toISOString().slice(0,10);
        var played = JSON.parse(localStorage.getItem(playedKey) || '{}');

        function markPlayed(id){
            played[id] = true;
            localStorage.setItem(playedKey, JSON.stringify(played));
        }

        function beep(freqs, gapMs){
            try{
                var Ctx = window.AudioContext || window.webkitAudioContext;
                var ctx = new Ctx();
                var t = ctx.currentTime;
                freqs.forEach(function(f, i){
                    var osc = ctx.createOscillator();
                    var gain = ctx.createGain();
                    osc.frequency.value = f;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.0001, t);
                    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.5);
                    t += (gapMs || 500) / 1000;
                });
            } catch(e){ /* Web Audio unavailable -- silently skip the chime */ }
        }

        var CHIMES = {
            azaan: function(){ beep([392, 392], 700); },          // low double tone -- "time for namaz"
            birthday: function(){ beep([523, 659, 784], 180); },  // bright ascending triad
            festival: function(){ beep([440, 660], 550); },       // bell-ish two-tone
            gah: function(){ beep([349, 440], 400); },            // soft two-tone -- Gah transition
            shabbat: function(){ beep([494, 587, 659], 260); }    // gentle ascending triad -- candle lighting
        };

        // Optional real audio files, one per category/tradition -- drop
        // your own licensed recordings in static/sounds/ using these exact
        // names and the app plays them in full instead of the synthesized
        // chime. Nothing ships here by default; see static/sounds/README.txt.
        var SOUND_FILES = {
            azaan: '/static/sounds/azaan.mp3',
            christian: '/static/sounds/christian.mp3',
            jewish: '/static/sounds/jewish.mp3',
            hindu: '/static/sounds/hindu.mp3',
            parsi: '/static/sounds/parsi.mp3',
            french: '/static/sounds/french.mp3'
        };

        // Ringtone choices from Settings -- single source of truth is
        // main.py's RINGTONE_OPTIONS, injected here so this list can't
        // drift out of sync with the <select> options on settings.html.
        var RINGTONE_OPTIONS = {{ ringtone_options|tojson }};

        function ringtoneFile(key){
            var opt = RINGTONE_OPTIONS[key];
            return (opt && opt.file) ? opt.file : null;
        }

        function playSound(key, fallbackChime){
            var path = SOUND_FILES[key];
            if (path) {
                var audio = new Audio(path);
                var played = audio.play();
                if (played && played.catch) {
                    // 404 (no file dropped in yet), autoplay-block, or
                    // unsupported format all land here -- fall back quietly.
                    played.catch(function(){ fallbackChime(); });
                }
                return;
            }
            fallbackChime();
        }

        // Same idea as playSound above, but resolves through RINGTONE_OPTIONS
        // (Settings' birthday/anniversary pickers, or a per-event override)
        // instead of the fixed SOUND_FILES map.
        function playRingtone(ringtoneKey, fallbackChime){
            var file = ringtoneFile(ringtoneKey);
            if (file) {
                var audio = new Audio(file);
                var played = audio.play();
                if (played && played.catch) played.catch(function(){ fallbackChime(); });
                return;
            }
            fallbackChime();
        }

        function notify(title, body){
            if (window.Notification && Notification.permission === 'granted') {
                new Notification(title, {body: body});
            }
        }

        function scheduleAt(hhmm, id, soundKey, fallbackChime, title, body){
            if (!hhmm || hhmm.indexOf(':') === -1 || played[id]) return;
            var parts = hhmm.split(':').map(Number);
            var now = new Date();
            var target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parts[0], parts[1], 0, 0);
            var ms = target.getTime() - now.getTime();
            if (ms <= 0 || ms > 24*60*60*1000) return; // already past, or bad data
            setTimeout(function(){
                playSound(soundKey, fallbackChime);
                notify(title, body);
                markPlayed(id);
            }, ms);
        }

        function loadAndSchedule(){
            fetch('{{ url_for("api_alerts_today") }}').then(function(r){ return r.json(); }).then(function(data){
                var prefsData = data.prefs || {};
                var pt = data.prayer_times || {};

                // Azaan only fires when BOTH are true: the toggle in
                // Settings is on, AND the default calendar is Hijri-family
                // (Bohra/Sunni/Shia). This is a hard gate, not just a
                // display hint -- flip the calendar to Gregorian and these
                // never get scheduled at all, even with the setting checked.
                if (prefsData.alert_azaan && prefsData.is_hijri_family) {
                    [['fajr','Fajr'], ['zawal','Zuhr'], ['asr','Asr'], ['maghrib','Maghrib'], ['isha','Isha']]
                        .forEach(function(pair){
                            scheduleAt(pt[pair[0]], 'azaan-' + pair[0], 'azaan', CHIMES.azaan,
                                       pair[1] + ' time', pt[pair[0]] + ' -- ' + pair[1]);
                        });
                }

                (data.personal_events || []).forEach(function(ev, i){
                    if (prefsData.alert_birthday_anniversary === false) return;
                    if (played['bday-' + ev.id]) return;

                    // Precedence: a per-event override (ev.ringtone, set on
                    // the event itself) beats the category default from
                    // Settings (birthday_ringtone / anniversary_ringtone).
                    // Settings only has those two selects -- death/religious/
                    // other categories have no dedicated ringtone setting,
                    // so they get the neutral synth beep rather than either
                    // the birthday or anniversary tone (a death/memorial
                    // event ringing a bright birthday triad would be wrong).
                    var categoryDefault;
                    var fallback;
                    if (ev.category === 'anniversary') {
                        categoryDefault = prefsData.anniversary_ringtone;
                        fallback = CHIMES.festival;
                    } else if (ev.category === 'birthday') {
                        categoryDefault = prefsData.birthday_ringtone;
                        fallback = CHIMES.birthday;
                    } else {
                        categoryDefault = 'beep';
                        fallback = CHIMES.gah; // neutral soft two-tone, not celebratory
                    }
                    var ringtoneKey = ev.ringtone || categoryDefault;

                    playRingtone(ringtoneKey, fallback);
                    notify(ev.title, (ev.category || 'event') + ' today');
                    markPlayed('bday-' + ev.id);
                });

                (data.interfaith_events || []).forEach(function(ev, i){
                    var id = 'fest-' + ev.tradition + '-' + ev.title;
                    if (!played[id]) {
                        playSound(ev.tradition, CHIMES.festival);
                        notify(ev.title, ev.tradition + ' today');
                        markPlayed(id);
                    }
                });

                // Gah Change Alert (Parsi) -- gah.minutes_to_change tells us
                // how far off the next transition is; schedule a one-shot
                // timer for it rather than polling, same pattern as azaan.
                if (data.gah && data.gah.minutes_to_change != null) {
                    var gahId = 'gah-' + data.gah.gah + '-' + new Date().toDateString();
                    if (!played[gahId] && data.gah.minutes_to_change <= 1440) {
                        setTimeout(function(){
                            playSound('gah', CHIMES.gah);
                            notify('Gah changed', 'Now entering the next Gah');
                            markPlayed(gahId);
                        }, Math.max(0, data.gah.minutes_to_change * 60000));
                    }
                }

                // Shabbat candle-lighting reminder (Friday only).
                if (data.shabbat && data.shabbat.candle_lighting_iso) {
                    scheduleAt(data.shabbat.candle_lighting, 'shabbat-candles',
                               'shabbat', CHIMES.shabbat,
                               'Candle lighting', data.shabbat.candle_lighting + ' -- Shabbat begins');
                }
            }).catch(function(){ /* server unreachable -- skip silently */ });
        }

        function start(){
            if (window.Notification && Notification.permission === 'default') {
                Notification.requestPermission();
            }
            loadAndSchedule();
        }

        toggle.checked = localStorage.getItem(STORAGE_KEY) === '1';
        if (toggle.checked) start();
        toggle.addEventListener('change', function(){
            localStorage.setItem(STORAGE_KEY, toggle.checked ? '1' : '0');
            if (toggle.checked) start();
        });
    })();
    </script>
</body>
</html>
